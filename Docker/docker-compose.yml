name: traverse

services:
  backend:
    build:
      context: ..
      dockerfile: Docker/Backend/Dockerfile
    container_name: traverse-backend
    restart: always
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
      ANON_KEY: ${ANON_KEY}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID}
      SERVER_PORT: ${SERVER_PORT:-3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    networks:
      - traefik_net

  frontend:
    build:
      context: ..
      dockerfile: Docker/Frontend/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_KEY: ${VITE_SUPABASE_KEY}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID}
    container_name: traverse-frontend
    restart: always
    networks:
      - traefik_net

  supabase-db:
    image: supabase/postgres:17.6.1.136
    container_name: traverse-supabase-db
    restart: always
    profiles: [self-hosted]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      - ./Supabase/sql/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:ro
      - ./Supabase/sql/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./Supabase/sql/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - ./Supabase/sql/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:ro
      - ./Supabase/sql/logs.sql:/docker-entrypoint-initdb.d/migrations/99-logs.sql:ro
      - ./Supabase/sql/pooler.sql:/docker-entrypoint-initdb.d/migrations/99-pooler.sql:ro
      - ./Supabase/sql/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
      - ./Supabase/sql/Initial_Schema.sql:/docker-entrypoint-initdb.d/migrations/99-zz-app-schema.sql:ro
    networks:
      - supabase_internal

  supabase-auth:
    image: supabase/gotrue:v2.189.0
    container_name: traverse-supabase-auth
    restart: always
    profiles: [self-hosted]
    depends_on:
      - supabase-db
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
    networks:
      - supabase_internal

  supabase-rest:
    image: postgrest/postgrest:v14.12
    container_name: traverse-supabase-rest
    restart: always
    profiles: [self-hosted]
    depends_on:
      - supabase-db
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
    networks:
      - supabase_internal

  supabase-meta:
    image: supabase/postgres-meta:v0.96.6
    container_name: traverse-supabase-meta
    restart: always
    profiles: [self-hosted]
    depends_on:
      - supabase-db
    environment:
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - supabase_internal

  supabase-studio:
    image: supabase/studio:2026.08.03-sha-022b374
    container_name: traverse-supabase-studio
    restart: always
    profiles: [self-hosted]
    depends_on:
      - supabase-meta
      - supabase-kong
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://supabase-meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
    networks:
      - supabase_internal

  supabase-storage:
    image: supabase/storage-api:v1.60.4
    container_name: traverse-supabase-storage
    restart: always
    profiles: [self-hosted]
    depends_on:
      - supabase-db
      - supabase-rest
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://supabase-rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      STORAGE_PUBLIC_URL: ${SUPABASE_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: local
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - supabase-storage-data:/var/lib/storage
    networks:
      - supabase_internal

  supabase-kong:
    image: kong/kong:3.9.3
    container_name: traverse-supabase-kong
    restart: always
    profiles: [self-hosted]
    depends_on:
      - supabase-auth
      - supabase-rest
      - supabase-storage
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
    volumes:
      - ./Supabase/kong.yml:/tmp/temp.yml:ro
    entrypoint: >
      bash -c 'sed -e "s|\$${SUPABASE_ANON_KEY}|$$SUPABASE_ANON_KEY|g" -e "s|\$${SUPABASE_SERVICE_KEY}|$$SUPABASE_SERVICE_KEY|g" /tmp/temp.yml > /tmp/kong.yml && /entrypoint.sh kong docker-start'
    networks:
      - traefik_net
      - supabase_internal

volumes:
  supabase-db-data:
  supabase-storage-data:

networks:
  traefik_net:
    external: true
  supabase_internal:
    internal: true
