# Declarative Kong config (DB-less mode). Values in ${...} are substituted at
# container start (see the `entrypoint` override on supabase-kong in
# docker-compose.yml) from SUPABASE_ANON_KEY / SUPABASE_SERVICE_KEY env vars,
# so the actual key values never need to be committed here.
#
# Clients call SUPABASE_URL + "/auth/v1/..." and SUPABASE_URL + "/rest/v1/...".
# SUPABASE_URL is "https://traverse.shreyansh-dev.app/supabase", so the
# external Traefik config must route "/supabase/*" to this container's port
# 8000 while stripping the "/supabase" prefix before it reaches Kong, so Kong
# sees plain "/auth/v1/..." and "/rest/v1/..." as configured below.

_format_version: "2.1"
_transform: true

consumers:
  - username: anon
    keyauth_credentials:
      - key: ${SUPABASE_ANON_KEY}
  - username: service_role
    keyauth_credentials:
      - key: ${SUPABASE_SERVICE_KEY}

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  - name: auth-v1
    url: http://supabase-auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          key_names: [apikey]
          hide_credentials: true

  - name: rest-v1
    url: http://supabase-rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          key_names: [apikey]
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow: [anon, admin]

  # No key-auth here, unlike auth-v1/rest-v1 above: Storage handles authorization
  # itself (public-bucket objects must be fetchable by a plain <img> tag with no
  # apikey header at all; private-bucket access relies on whatever Authorization
  # header the client already sends, which passes through untouched).
  - name: storage-v1
    url: http://supabase-storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
